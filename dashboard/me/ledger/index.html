<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledger · Tidewall</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="wide">
  <header>
    <p class="eyebrow"><a href="/">Tidewall</a> / Ledger</p>
    <h1>Ledger</h1>
    <p class="lede" id="who">Loading...</p>
  </header>

  <main id="main" hidden>
    <section aria-labelledby="h-total">
      <h2 id="h-total">The study so far</h2>
      <div class="cards" id="totals"></div>
      <div class="capbar" id="capbar" role="img"><span></span></div>
    </section>

    <section aria-labelledby="h-payer">
      <h2 id="h-payer">Who paid</h2>
      <p class="muted">Tokens in millions. <strong>Fallback</strong> counts calls paid by someone other than the day's owner, because the owner had no working key for that provider.</p>
      <div class="table-wrap"><table class="num" id="payers"></table></div>
    </section>

    <section aria-labelledby="h-runs">
      <h2 id="h-runs">By run</h2>
      <div class="table-wrap"><table class="num" id="runs"></table></div>
    </section>

    <section aria-labelledby="h-days">
      <h2 id="h-days">Day by day</h2>
      <label class="pick">Run <select id="pick"></select></label>
      <div class="table-wrap"><table class="num" id="days"></table></div>
    </section>
  </main>

  <footer>
    <a href="/">Back to the city</a>
    <a href="/me/control/">Control</a>
    <a href="/me/">My keys</a>
    <a href="/cdn-cgi/access/logout">Sign out</a>
  </footer>

  <script src="/me/ledger/ledger.js"></script>
  <script src="/nav.js"></script>
</body>
</html>
