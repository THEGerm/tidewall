name: Deploy

on:
  push:
    branches: [main]
    paths: ["worker/**", "dashboard/**", ".github/workflows/deploy.yml"]
  pull_request:
    paths: ["worker/**", "dashboard/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx wrangler d1 migrations apply tidewall --remote
      - run: npx wrangler deploy
      # Creates the key-encryption secret once. Never replaced: a new one
      # would make every saved key unreadable. The value is never printed.
      - name: Ensure KEY_ENC_SECRET exists
        run: |
          if npx wrangler secret list --format json | grep -q '"KEY_ENC_SECRET"'; then
            echo "KEY_ENC_SECRET already set"
          else
            openssl rand -base64 32 | npx wrangler secret put KEY_ENC_SECRET
          fi
