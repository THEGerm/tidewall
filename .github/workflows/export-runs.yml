name: Export finished runs

# Once an hour, saves every finished run that isn't in data/runs/ yet, from the
# public export (GET /api/runs/:id/export, unsealed runs only: a study run
# opens when its whole triple has ended). Study runs go to
# data/runs/study/, Study 2 runs (lightweight models, Germ 2 Nov) to
# data/runs/study2/, test runs (and study-model runs outside triples 1 to 9,
# such as a smoke test) to data/runs/test/. A saved file is never rewritten. Payer names only, no emails.
# Bot runs are skipped: their seed replays them exactly, and a 10,000-day one
# is too big for the repo.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-runs
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download finished runs not yet saved
        env:
          SITE: https://tidewall.tcdar400.workers.dev
        run: |
          set -euo pipefail
          curl -fsS "$SITE/api/runs" \
            | jq -r '.runs[] | select(.sealed == false and .model_set != "bot") | "\(if .model_set == "study" and (.triple // 0) == 0 then "test" else .model_set end) \(.id)"' \
            | while read -r set id; do
                f="data/runs/$set/$id.json"
                [ -f "$f" ] && continue
                mkdir -p "data/runs/$set"
                curl -fsS "$SITE/api/runs/$id/export" | jq . > "$f.tmp"
                if grep -qE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' "$f.tmp"; then echo "::error::$id export contains an email address, not saved"; rm "$f.tmp"; continue; fi
                mv "$f.tmp" "$f"
                echo "saved $f"
              done
      - name: Download judge codes not yet saved
        # The judges' codes of a run (#112), once every item is coded or out of
        # attempts. Saved apart from the run, in data/judges/, because a run's
        # export is saved once, usually before it is judged.
        env:
          SITE: https://tidewall.tcdar400.workers.dev
        run: |
          set -euo pipefail
          mkdir -p data/judges
          curl -fsS "$SITE/api/runs" \
            | jq -r '.runs[] | select(.sealed == false and .model_set != "bot") | .id' \
            | while read -r id; do
                f="data/judges/$id.json"
                [ -f "$f" ] && continue
                curl -fsS "$SITE/api/runs/$id/judges" > "$f.tmp" || { rm -f "$f.tmp"; continue; }
                if [ "$(jq -r '.judges.complete // false' "$f.tmp")" != "true" ]; then rm "$f.tmp"; continue; fi
                if grep -qE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' "$f.tmp"; then echo "::error::$id judge codes contain an email address, not saved"; rm "$f.tmp"; continue; fi
                jq . "$f.tmp" > "$f" && rm "$f.tmp"
                echo "saved $f"
              done
      - name: Commit
        run: |
          git add data/runs data/judges
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git config user.name "tidewall-export"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Export finished runs: $(git diff --cached --name-only | xargs -n1 basename | sed 's/\.json$//' | paste -sd, -)"
          git push
